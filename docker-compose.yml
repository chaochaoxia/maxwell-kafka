# Local lab: Kafka (KRaft, no ZooKeeper) + Maxwell + Kafka web UI.
#
# Two Kafka listeners:
#   localhost:9092  — Go consumer on the Mac
#   broker:19092    — Maxwell and the web UI, on the Docker network
#
# Web UI: http://localhost:8080
# Maxwell reaches the Mac's MySQL via host.docker.internal:3306.
services:
  broker:
    image: apache/kafka:3.9.1
    hostname: broker
    container_name: maxwell-kafka-broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  maxwell:
    image: zendesk/maxwell:latest
    # Hub image is amd64-only. Docker Desktop runs it under emulation on Apple Silicon.
    platform: linux/amd64
    container_name: maxwell
    depends_on:
      broker:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - bin/maxwell
      - --host=host.docker.internal
      - --port=3306
      - --user=maxwell
      - --password=maxwell
      - --producer=kafka
      - --kafka.bootstrap.servers=broker:19092
      - --kafka_topic=maxwell
      - --output_ddl=true
    restart: unless-stopped

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    depends_on:
      broker:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker:19092
      DYNAMIC_CONFIG_ENABLED: "true"
